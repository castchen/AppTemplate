name: AppTemplate
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1,2"
  configs:
    Debug:
      # Pull-request builds compile for the simulator and do not sign.
      CODE_SIGN_STYLE: Automatic
      CODE_SIGNING_ALLOWED: NO
      CODE_SIGNING_REQUIRED: NO
      CODE_SIGN_IDENTITY: ""
    Release:
      DEVELOPMENT_TEAM: YOUR_TEAM_ID
      CODE_SIGN_STYLE: Manual
      CODE_SIGN_IDENTITY: "Apple Distribution"
      PROVISIONING_PROFILE_SPECIFIER: "match AppStore com.example.apptemplate"

configs:
  Debug: debug
  Release: release

targets:
  AppTemplate:
    type: application
    platform: iOS
    supportedDestinations: [iOS]
    sources:
      - path: Sources
      - path: Resources
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.apptemplate
        PRODUCT_NAME: AppTemplate
        INFOPLIST_FILE: Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO

schemes:
  AppTemplate:
    build:
      targets:
        AppTemplate: all
    run:
      config: Debug
    archive:
      config: Release
