name: Beta

on:
  workflow_dispatch:
    inputs:
      command:
        description: "beta: readonly Match, then TestFlight. certificates: one-time writable Match sync only."
        required: true
        type: choice
        default: beta
        options:
          - beta
          - certificates

permissions:
  contents: read

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  testflight:
    name: Match → gym → TestFlight
    runs-on: macos-26
    timeout-minutes: 60
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
      APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
      APP_STORE_CONNECT_API_KEY_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY }}
      MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
      MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
      MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Require signing secrets
        env:
          FASTLANE_COMMAND: ${{ inputs.command }}
        run: |
          set -euo pipefail
          missing=()
          for name in \
            APPLE_TEAM_ID \
            APP_STORE_CONNECT_API_KEY_ID \
            APP_STORE_CONNECT_API_ISSUER_ID \
            APP_STORE_CONNECT_API_KEY_KEY \
            MATCH_PASSWORD \
            MATCH_GIT_URL \
            MATCH_GIT_BASIC_AUTHORIZATION
          do
            if [ -z "${!name}" ]; then
              missing+=("$name")
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing GitHub Secrets: ${missing[*]}. See README.md. No secret values were printed."
            exit 1
          fi
          case "${FASTLANE_COMMAND}" in
            beta)
              echo "FASTLANE_LANE=beta" >> "$GITHUB_ENV"
              echo "MATCH_READONLY=true" >> "$GITHUB_ENV"
              echo "Readonly Match, then TestFlight."
              ;;
            certificates)
              echo "FASTLANE_LANE=certificates" >> "$GITHUB_ENV"
              echo "MATCH_READONLY=false" >> "$GITHUB_ENV"
              echo "Writable Match sync only. No archive or upload."
              ;;
            *)
              echo "::error::Unknown command: ${FASTLANE_COMMAND}"
              exit 1
              ;;
          esac

      - name: Show Xcode
        run: xcodebuild -version

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Install XcodeGen
        run: |
          brew install xcodegen
          xcodegen --version

      - name: Run Fastlane
        run: |
          set -euo pipefail

          # Phone paste often adds whitespace / a trailing slash; SSH URLs break Basic auth.
          url="$(printf '%s' "${MATCH_GIT_URL}" | tr -d '\r\n\t ')"
          url="${url%/}"
          case "$url" in
            https://github.com/*/*) ;;
            *)
              echo "::error::MATCH_GIT_URL must be HTTPS like https://github.com/OWNER/apptemplate-match.git (not git@...)."
              exit 1
              ;;
          esac
          export MATCH_GIT_URL="$url"

          # Newlines in MATCH_GIT_BASIC_AUTHORIZATION cause git/libcurl "bad argument".
          # Accept either base64(username:PAT) or raw username:PAT (phone-friendly).
          # Keep python one-liners so this YAML block stays valid.
          cleaned="$(printf '%s' "${MATCH_GIT_BASIC_AUTHORIZATION}" | tr -d '\r\n\t ')"
          decoded="$(printf '%s' "$cleaned" | python3 -c 'import base64,sys; sys.stdout.buffer.write(base64.b64decode(sys.stdin.buffer.read(), validate=False))' 2>/dev/null || true)"
          if printf '%s' "$decoded" | grep -Eq '^[^[:space:]]+:[^[:space:]]+$'; then
            export MATCH_GIT_BASIC_AUTHORIZATION="$cleaned"
            echo "Match git auth: using base64 username:token (whitespace stripped)."
          elif printf '%s' "$cleaned" | grep -Eq '^[^[:space:]]+:[^[:space:]]+$'; then
            export MATCH_GIT_BASIC_AUTHORIZATION="$(printf '%s' "$cleaned" | python3 -c 'import base64,sys; print(base64.b64encode(sys.stdin.buffer.read()).decode(), end="")')"
            echo "Match git auth: encoded raw username:token to base64 in CI."
          else
            echo "::error::MATCH_GIT_BASIC_AUTHORIZATION must be base64 of username:PAT, or the raw username:PAT string. No secret values were printed."
            exit 1
          fi

          bundle exec fastlane ios "$FASTLANE_LANE"
